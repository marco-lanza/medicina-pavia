<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicina Pavia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header con titolo e bottone Tema (Chiaro/Scuro) -->
    <header class="glass-header">
        <h1>Medicina Pavia</h1>
        <button id="theme-toggle" class="glass-icon-btn">🌙</button>
    </header>

    <div id="app-container">
        <!-- Schermata Login -->
        <div id="view-login" class="view glass-panel">
            <h2>Accesso Protetto</h2>
            <input type="password" id="pass-input" placeholder="Inserisci password" class="glass-input">
            <button id="btn-login" class="glass-btn">Accedi</button>
        </div>

        <!-- Schermata Selezione Anni (Pill-shaped) -->
        <div id="view-anni" class="view years-list" style="display: none;">
            <button class="year-pill" onclick="apriPannelloAnno('Primo Anno', 'primo-anno')">
                <span class="dot"></span> Primo Anno
            </button>
            <button class="year-pill" onclick="apriPannelloAnno('Secondo Anno', 'secondo-anno')">
                <span class="dot"></span> Secondo Anno
            </button>
            <button class="year-pill" onclick="apriPannelloAnno('Terzo Anno', 'terzo-anno')">
                <span class="dot"></span> Terzo Anno
            </button>
            <button class="year-pill" onclick="apriPannelloAnno('Quarto Anno', 'quarto-anno')">
                <span class="dot"></span> Quarto Anno
            </button>
            <button class="year-pill" onclick="apriPannelloAnno('Quinto Anno', 'quinto-anno')">
                <span class="dot"></span> Quinto Anno
            </button>
            <button class="year-pill" onclick="apriPannelloAnno('Sesto Anno', 'sesto-anno')">
                <span class="dot"></span> Sesto Anno
            </button>
        </div>
    </div>

    <!-- PANNELLO MODALE (Si apre in sovrimpressione, stile Nuovo Evento) -->
    <div id="modal-overlay" class="overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <!-- Il pallino si trasforma nella freccia indietro -->
                <button id="close-modal-btn" class="back-arrow-btn">&lt;</button>
                <h2 id="modal-title">Anno</h2>
            </div>
            
            <!-- Griglia delle materie (verrà popolata via JS) -->
            <div id="materie-grid" class="grid-container">
                <!-- Esempio di box che verranno iniettati da JS -->
            </div>
            
            <!-- Spazio per i contenuti della singola materia -->
            <div id="lista-materiali" style="display: none;"></div>
        </div>
    </div>

    <!-- Collegamento a Firebase (mantieni il tuo blocco di import originario in app.js) -->
    <script type="module" src="app.js"></script>
</body>
</html>
