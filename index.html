<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medicina Pavia</title>
    <!-- Solo FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sfondo Fotografico Dinamico (Leonardo da Vinci) -->
    <div class="wallpaper-bg"></div>

    <!-- Header largo 800px allineato al pannello -->
    <header class="glass-pill top-header">
        <h1 class="nav-title">Medicina Pavia</h1>
        <div class="theme-toggle-container" onclick="toggleTheme()">
            <div id="theme-slider" class="theme-slider"></div>
            <div class="theme-icon"><i class="fas fa-sun"></i></div>
            <div class="theme-icon"><i class="fas fa-moon"></i></div>
        </div>
    </header>

    <main id="app-container" class="app-main">
        
        <!-- Schermata Login -->
        <div id="view-login" class="view-section glass-panel login-panel">
            <h2>Area Riservata</h2>
            <input type="password" id="pass-input" placeholder="Password" class="glass-input">
            <button id="btn-login" class="glass-btn-solid">Accedi</button>
        </div>

        <!-- Schermata Anni -->
        <div id="view-anni" class="view-section years-container" style="display: none;">
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Primo Anno', 'primo-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Primo Anno</span>
            </button>
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Secondo Anno', 'secondo-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Secondo Anno</span>
            </button>
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Terzo Anno', 'terzo-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Terzo Anno</span>
            </button>
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Quarto Anno', 'quarto-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Quarto Anno</span>
            </button>
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Quinto Anno', 'quinto-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Quinto Anno</span>
            </button>
            <button class="glass-pill year-btn" onclick="apriPannelloAnno('Sesto Anno', 'sesto-anno', this)">
                <div class="pill-dot"></div> <span class="pill-text">Sesto Anno</span>
            </button>
        </div>
    </main>

    <!-- Overlay Blur (Sfoca le foto, ma non l'Header) -->
    <div id="modal-overlay" class="modal-backdrop hidden"></div>

    <!-- Pannello Morphing -->
    <div id="modal-content" class="morph-panel hidden-morph">
        <div class="panel-header" id="panel-header">
            <div id="morph-dot" class="morph-dot-element">
                <i class="fas fa-chevron-left back-icon" id="back-icon"></i>
            </div>
            <!-- Titolo che mantiene sempre il font sottile e invariato -->
            <h2 id="modal-title" class="panel-title">Anno</h2>
        </div>
        
        <!-- Split View (Sinistra Materie / Destra Risorse) -->
        <div id="split-view" class="split-view">
            <div class="split-left" id="materie-list"></div>
            <div class="split-right" id="risorse-list">
                <div class="placeholder-text">Seleziona una materia per visualizzare il materiale</div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
